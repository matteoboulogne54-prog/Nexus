  }

    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

    animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;

     {id:"p14",cat:"Options",name:"Maintenance mensuelle",price:5,desc:"5 à 10 € selon le périmètre"},
    ];

    let state = {clients:[],products:JSON.parse(JSON.stringify(DEFAULT_PRODUCTS)),quotes:[],orders:[],transactions:[],invoices:[]};
    let active = "Dashboard";
    let expandedOrders = new Set();

    function makeDefaultSteps(){
      return DEFAULT_ORDER_STEPS.map(label => ({ id: uid("step-"), label, done: false }));
    }
    // Rétro-compatibilité : initialise les étapes de suivi pour les commandes créées avant cette fonctionnalité
    function ensureOrderSteps(o){
      if(!o.steps || !Array.isArray(o.steps)) o.steps = makeDefaultSteps();
      return o.steps;
    }
    
    const syncStatusEl = document.getElementById("sync-status");
    const syncDotEl = document.getElementById("sync-dot");

    // Theme Toggle Functionality
    const themeBtn = document.getElementById('theme-toggle');
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      if (document.documentElement.classList.contains('dark')) {
        document.body.classList.remove('bg-slate-50', 'text-slate-900');
        document.body.classList.add('bg-darkbg', 'text-slate-100');
      } else {
        document.body.classList.remove('bg-darkbg', 'text-slate-100');
        document.body.classList.add('bg-slate-50', 'text-slate-900');
      }
    });

    // Toast Notifications System
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const bgColors = {
        success: 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200',
        error: 'bg-rose-950/90 border-rose-500/50 text-rose-200',
        info: 'bg-slate-900/90 border-brand-500/50 text-brand-200'
      };

      const icons = {
        success: 'check-circle-2',
        error: 'alert-triangle',
        info: 'info'
      };

      toast.className = `toast-anim pointer-events-auto flex items-center gap-3 p-4 rounded-xl border backdrop-blur-md shadow-xl text-sm font-medium ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0"></i>
        <span class="flex-1">${message}</span>
      `;

      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'scale(0.95)';
        toast.style.transition = 'all 0.2s ease-out';
        setTimeout(() => toast.remove(), 200);
      }, 3500);
    }

    // Firebase Listener
    onValue(dbRef, (snapshot) => {
      const data = snapshot.val();
      if(data) {
        state = {
          clients: data.clients || [],
          products: data.products && data.products.length ? data.products : JSON.parse(JSON.stringify(DEFAULT_PRODUCTS)),
          quotes: data.quotes || [],
          orders: data.orders || [],
          transactions: data.transactions || [],
          invoices: data.invoices || []
        };
        try { localStorage.setItem("nexus_data", JSON.stringify(state)); } catch(e){}
        updateSyncStatus("Synchronisé (Firebase)", "bg-emerald-400");
      } else {
        let s = null;
        try{ s = JSON.parse(localStorage.getItem("nexus_data")); }catch(e){}
        if(s) state = s;
        save();
        updateSyncStatus("Initialisé (Firebase)", "bg-emerald-400");
      }
      render();
    }, (error) => {
      console.warn("Erreur de connexion Firebase, utilisation du cache local :", error);
      updateSyncStatus("Hors ligne (Local)", "bg-amber-400");
      let s = null;
      try{ s = JSON.parse(localStorage.getItem("nexus_data")); }catch(e){}
      if(!s) s = {clients:[],products:JSON.parse(JSON.stringify(DEFAULT_PRODUCTS)),quotes:[],orders:[],transactions:[],invoices:[]};
      state = s;
      render();
    });

    function updateSyncStatus(text, dotColorClass) {
      syncStatusEl.textContent = text;
      syncDotEl.className = `w-2 h-2 rounded-full ${dotColorClass}`;
    }

    function save(quiet = false){
      try {
        localStorage.setItem("nexus_data", JSON.stringify(state));
        set(dbRef, state).then(() => {
          updateSyncStatus("Enregistré", "bg-emerald-400");
          if (!quiet) showToast("Modifications synchronisées", "success");
          setTimeout(() => { updateSyncStatus("Synchronisé (Firebase)", "bg-emerald-400"); }, 2000);
        }).catch(err => {
          console.error("Erreur d'écriture Firebase:", err);
          updateSyncStatus("Erreur sync", "bg-rose-500");
          showToast("Erreur de synchronisation Firebase", "error");
        });
      } catch(e) {
        showToast("Erreur de sauvegarde locale", "error");
      }
    }

    function eur(n){ return (Number(n)||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}); }

    // Génère et télécharge un vrai fichier PDF à partir d'un bout de HTML
    function downloadPDF(innerHtml, filename){
      if(typeof html2pdf === "undefined"){
        showToast("Bibliothèque PDF non chargée (vérifiez votre connexion internet).", "error");
        return;
      }
      showToast("Génération du PDF en cours...", "info");

      const wrapper = document.createElement("div");
      wrapper.style.cssText = "position:fixed; left:-10000px; top:0; z-index:-1;";
      wrapper.innerHTML = innerHtml;
      document.body.appendChild(wrapper);

      const opt = {
        margin: 0,
        filename: filename,
        image: { type: "jpeg", quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
      };

      html2pdf().set(opt).from(wrapper).save().then(() => {
        wrapper.remove();
        showToast("PDF téléchargé avec succès !", "success");
      }).catch(() => {
        wrapper.remove();
        showToast("Erreur lors de la génération du PDF.", "error");
      });
    }

      nav.innerHTML = "";

        const isActive = t.id === active;
        const b = document.createElement("button");
        b.className = `flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 ${

            ? "bg-brand-500/10 text-brand-300 border border-brand-500/30 shadow-md shadow-brand-500/5 glow-cyan" 
            : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent"
        }`;
        b.innerHTML = `<i data-lucide="${t.icon}" class="w-4 h-4 ${isActive ? 'text-brand-400' : 'text-slate-400'}"></i>${t.label}`;
        b.onclick = () => { active = t.id; render(); };
        nav.appendChild(b);
      });
      lucide.createIcons();
    }

    function quoteTotal(q){ return q.items.reduce((a,it)=>a+it.price*it.qty,0)*(1-(q.discount||0)/100); }

    function renderDevis(m){
      if(!state.clients.length){
        const c0 = createCard("Nouveau devis");
        c0.innerHTML += `<div class="p-6 text-center text-xs text-amber-400 bg-amber-500/10 border border-amber-500/20 rounded-xl">Veuillez d'abord ajouter au moins un client dans l'onglet CRM.</div>`;
        m.appendChild(c0);
      } else {
        const c = createCard("Créer un Devis", "Sélectionnez les articles du catalogue pour composer votre devis");
        c.innerHTML += `
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Client *</label>
              <select id="q_client" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500">
                ${state.clients.map(cl => `<option value="${cl.id}">${cl.name} ${cl.company?`(${cl.company})`:''}</option>`).join("")}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Remise globale (%)</label>
              <input id="q_discount" type="number" min="0" max="100" value="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Date d'expiration</label>
              <input id="q_exp" type="date" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-brand-500">
            </div>
          </div>

          <!-- Catalog items picker -->
          <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-400 mb-2">Ajouter depuis le catalogue :</label>
            <div id="q_catalog" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-2 bg-slate-950/60 rounded-xl border border-slate-800"></div>
          </div>

          <!-- Cart items list -->
          <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-400 mb-2">Articles sélectionnés dans ce devis :</label>
            <div id="q_cart" class="space-y-2 bg-slate-950/40 p-3 rounded-xl border border-slate-800 min-h-[80px]"></div>
          </div>

          <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-800">
            <div id="q_totalLine" class="text-sm font-bold text-slate-200">Total : €0.00</div>
            <button id="btn-create-quote" class="bg-gradient-to-r from-brand-500 to-cyan-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-xs flex items-center gap-2 hover:opacity-90 shadow-md shadow-brand-500/20 w-full sm:w-auto justify-center">
              <i data-lucide="file-plus" class="w-4 h-4"></i> Générer le devis
            </button>
          </div>
        `;

        let cart = [];
        const catBox = c.querySelector("#q_catalog");

        state.products.forEach(p => {
          const b = document.createElement("button");
          b.className = "text-left text-xs bg-slate-900 border border-slate-800 hover:border-brand-500/50 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg transition-all flex items-center gap-2";
          b.type = "button";
          b.innerHTML = `<i data-lucide="plus-circle" class="w-3.5 h-3.5 text-brand-400"></i><span>${p.name}</span> <span class="font-bold text-brand-300">${eur(p.price)}</span>`;
          b.onclick = () => {
            const ex = cart.find(l => l.pid === p.id);
            if(ex) ex.qty++; else cart.push({pid: p.id, qty: 1});
            renderCart();
          };
          catBox.appendChild(b);
        });

        function renderCart(){
          const box = c.querySelector("#q_cart");
          box.innerHTML = "";
          if(!cart.length){
            box.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-4">Votre devis ne contient aucun article. Cliquez sur une prestation ci-dessus.</p>`;
          }

          let total = 0;
          cart.forEach((l, i) => {
            const p = state.products.find(x => x.id === l.pid);
            if(!p) return;
            total += p.price * l.qty;

            const row = document.createElement("div");
            row.className = "flex items-center justify-between gap-3 bg-slate-900/80 p-2.5 rounded-lg border border-slate-800 text-xs";
            row.innerHTML = `
              <div class="flex-1 font-semibold text-slate-200">${p.name}</div>
              <div class="flex items-center gap-2">
                <span class="text-slate-400">Qté:</span>
                <input class="cartQty bg-slate-950 border border-slate-800 rounded px-2 py-0.5 text-xs text-slate-200 w-16 focus:outline-none focus:border-brand-500" type="number" min="1" value="${l.qty}">
              </div>
              <div class="font-bold text-brand-300 w-24 text-right">${eur(p.price * l.qty)}</div>
              <button class="rmC text-rose-400 hover:text-rose-300 p-1 rounded hover:bg-rose-500/10" type="button">
                <i data-lucide="x" class="w-4 h-4 pointer-events-none"></i>
              </button>
            `;

            row.querySelector(".cartQty").onchange = e => {
              l.qty = Math.max(1, Number(e.target.value) || 1);
              renderCart();
            };
            row.querySelector(".rmC").onclick = () => {
              cart.splice(i, 1);
              renderCart();
            };
            box.appendChild(row);
          });

          const discount = Number(c.querySelector("#q_discount").value) || 0;
          const finalTotal = total * (1 - discount / 100);
          c.querySelector("#q_totalLine").innerHTML = `Montant Total : <span class="text-brand-400 text-base">${eur(finalTotal)}</span> ${discount ? `<span class="text-xs font-normal text-slate-400">(Remise de ${discount}% appliquée)</span>` : ''}`;
          lucide.createIcons();
        }

        c.querySelector("#q_discount").addEventListener("input", renderCart);
        renderCart();

        c.querySelector("#btn-create-quote").onclick = () => {
          if(!cart.length) return showToast("Veuillez ajouter au moins une prestation au devis.", "error");

          const items = cart.map(l => {
            const p = state.products.find(x => x.id === l.pid);
            return { name: p.name, price: p.price, qty: l.qty };
          });

          state.quotes.push({
            id: uid("DEV-"),
            clientId: document.getElementById("q_client").value,
            items,
            discount: Number(document.getElementById("q_discount").value) || 0,
            date: today(),
            expiry: document.getElementById("q_exp").value,
            status: "Brouillon"
          });
          save();
          render();
          showToast("Devis généré avec succès !", "success");
        };

        m.appendChild(c);
      }

      // Historique des devis
      const list = createCard("Devis Générés", "Suivez l'état et la conversion de vos devis en commandes");
      const wrap = document.createElement("div"); 
      wrap.className = "overflow-x-auto";
      
      let rows = `
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="border-b border-slate-800 text-slate-400 uppercase font-semibold text-[11px] tracking-wider">
              <th class="py-3 px-3">N° Devis</th>
              <th class="py-3 px-3">Client</th>
              <th class="py-3 px-3">Date</th>
              <th class="py-3 px-3">Total</th>
              <th class="py-3 px-3">Statut</th>
              <th class="py-3 px-3 text-right">Action / Conversion</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/50">
      `;

      state.quotes.slice().reverse().forEach(q => {
        const cl = state.clients.find(c => c.id === q.clientId);
        rows += `
          <tr class="hover:bg-slate-800/30 transition-colors">
            <td class="py-3 px-3 font-mono font-bold text-brand-300">${q.id}</td>
            <td class="py-3 px-3 text-slate-200 font-semibold">${cl ? cl.name : "Client Inconnu"}</td>
            <td class="py-3 px-3 text-slate-400 font-mono text-[11px]">${q.date}</td>
            <td class="py-3 px-3 font-bold text-slate-100">${eur(quoteTotal(q))}</td>
            <td class="py-3 px-3">
              <select class="qStat bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-300 focus:outline-none focus:border-brand-500" data-id="${q.id}">
                ${QUOTE_STATUSES.map(s => `<option ${s===q.status?"selected":""}>${s}</option>`).join("")}
              </select>
            </td>
            <td class="py-3 px-3 text-right">
              ${q.status === "Accepté" && !q.converted 
                ? `<button class="convQ bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 hover:bg-emerald-500/20 px-3 py-1 rounded-lg text-xs font-bold transition-all" data-id="${q.id}">→ Transformer en Commande</button>` 
                : (q.converted ? `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Converti</span>` : "—")}
              <button class="sendQMail text-brand-400 hover:text-brand-300 p-1.5 rounded-lg hover:bg-brand-500/10 transition-all ml-1" data-id="${q.id}" title="Envoyer par E-mail">
                <i data-lucide="mail" class="w-4 h-4 pointer-events-none"></i>
              </button>
              <button class="downloadQPDF text-cyan-400 hover:text-cyan-300 p-1.5 rounded-lg hover:bg-cyan-500/10 transition-all ml-1" data-id="${q.id}" title="Télécharger le devis en PDF">
                <i data-lucide="download" class="w-4 h-4 pointer-events-none"></i>
              </button>
            </td>
          </tr>
        `;
      });

      rows += `</tbody></table>`;
      wrap.innerHTML = rows;
      list.appendChild(wrap);

      if(!state.quotes.length) {
        list.innerHTML += `<p class="text-xs text-slate-500 italic py-6 text-center">Aucun devis généré pour le moment.</p>`;
      }
      m.appendChild(list);

      list.querySelectorAll(".downloadQPDF").forEach(b => b.onclick = e => {
        const qId = e.target.closest("button").dataset.id;
        const q = state.quotes.find(x => x.id === qId);
        if(!q) return;
        const cl = state.clients.find(c => c.id === q.clientId);
        downloadPDF(quoteTemplateHTML(q, cl), `Devis_${q.id}.pdf`);
      });

      list.querySelectorAll(".qStat").forEach(s => s.onchange = e => {
        const q = state.quotes.find(x => x.id === e.target.dataset.id);
        if(q) {
          q.status = e.target.value;
          save();
          render();
        }
      });

      list.querySelectorAll(".convQ").forEach(b => b.onclick = e => {
        const q = state.quotes.find(x => x.id === e.target.dataset.id);
        if(!q) return;

        state.orders.push({
          id: uid("CMD-"),
          clientId: q.clientId,
          quoteId: q.id,
          items: q.items,
          price: quoteTotal(q),
          date: today(),
          deadline: "",
          priority: "Normale",
          desc: "",
          paymentStatus: "Non payé",
          status: "Nouvelle commande",
          steps: makeDefaultSteps()
        });

        q.converted = true;
        save();
        render();
        showToast(`Commande créée depuis le devis ${q.id}`, "success");
      });

      list.querySelectorAll(".sendQMail").forEach(b => b.onclick = e => {
        const qId = e.target.closest('button').dataset.id;
        active = "Emails";
        render();
        setTimeout(() => {
          const sel = document.getElementById("em_quote_select");
          if(sel) { sel.value = qId; sel.dispatchEvent(new Event('change')); }
        }, 50);
      });
    }

    /* ==========================================================================
       5. COMMANDES
       ========================================================================== */
    function renderCommandes(m){
      const list = createCard("Suivi des Commandes & Projets", "Gérez les statuts de livraison et la facturation");
      const wrap = document.createElement("div"); 
      wrap.className = "overflow-x-auto";
      
      let rows = `
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="border-b border-slate-800 text-slate-400 uppercase font-semibold text-[11px] tracking-wider">
              <th class="py-3 px-3">N° Commande</th>
              <th class="py-3 px-3">Client</th>
              <th class="py-3 px-3">Prix</th>
              <th class="py-3 px-3">Statut Production</th>
              <th class="py-3 px-3">Paiement</th>
              <th class="py-3 px-3">Suivi du projet</th>
              <th class="py-3 px-3 text-right">Facturation</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/50">
      `;

      state.orders.slice().reverse().forEach(o => {
        const cl = state.clients.find(c => c.id === o.clientId);
        const steps = ensureOrderSteps(o);
        const doneCount = steps.filter(s => s.done).length;
        const pct = steps.length ? Math.round((doneCount / steps.length) * 100) : 0;
        const isOpen = expandedOrders.has(o.id);
        rows += `
          <tr class="hover:bg-slate-800/30 transition-colors">
            <td class="py-3 px-3 font-mono font-bold text-purple-400">${o.id}</td>
            <td class="py-3 px-3 text-slate-200 font-semibold">${cl ? cl.name : "Client Inconnu"}</td>
            <td class="py-3 px-3 font-bold text-slate-100">${eur(o.price)}</td>
            <td class="py-3 px-3">
              <select class="oStat bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-300 focus:outline-none focus:border-brand-500" data-id="${o.id}">
                ${ORDER_STATUSES.map(s => `<option ${s===o.status?"selected":""}>${s}</option>`).join("")}
              </select>
            </td>
            <td class="py-3 px-3">
              <select class="oPay bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-300 focus:outline-none focus:border-brand-500" data-id="${o.id}">
                <option ${o.paymentStatus==="Non payé"?"selected":""}>Non payé</option>
                <option ${o.paymentStatus==="Partiel"?"selected":""}>Partiel</option>
                <option ${o.paymentStatus==="Payé"?"selected":""}>Payé</option>
              </select>
            </td>
            <td class="py-3 px-3 min-w-[140px]">
              <button class="toggleSteps flex items-center gap-2 w-full group" data-id="${o.id}">
                <div class="flex-1 h-1.5 rounded-full bg-slate-800 overflow-hidden">
                  <div class="h-full rounded-full ${pct===100 ? 'bg-emerald-400' : 'bg-brand-500'} transition-all" style="width:${pct}%"></div>
                </div>
                <span class="text-[10px] font-semibold text-slate-400 group-hover:text-slate-200 whitespace-nowrap">${doneCount}/${steps.length}</span>
                <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-500 group-hover:text-slate-200 transition-transform ${isOpen ? 'rotate-180' : ''}"></i>
              </button>
            </td>
            <td class="py-3 px-3 text-right">
              ${o.invoiced 
                ? `<span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">Facturée</span>` 
                : `<button class="mkInv bg-brand-500/10 text-brand-300 border border-brand-500/20 hover:bg-brand-500/20 px-3 py-1 rounded-lg text-xs font-bold transition-all" data-id="${o.id}">+ Générer Facture</button>`}
            </td>
          </tr>
          <tr class="stepsRow ${isOpen ? '' : 'hidden'}" data-steps-for="${o.id}">
            <td colspan="7" class="bg-slate-950/50 px-4 py-4">
              <div class="flex flex-col gap-2 max-w-xl">
                ${steps.map(s => `
                  <div class="flex items-center gap-2.5 group/step">
                    <input type="checkbox" class="stepCheck w-4 h-4 rounded border-slate-700 bg-slate-900 text-brand-500 focus:ring-brand-500 cursor-pointer" data-order="${o.id}" data-step="${s.id}" ${s.done ? "checked" : ""}>
                    <span class="flex-1 text-xs ${s.done ? 'text-slate-500 line-through' : 'text-slate-200'}">${s.label}</span>
                    <button class="delStep opacity-0 group-hover/step:opacity-100 text-slate-600 hover:text-rose-400 transition-all" data-order="${o.id}" data-step="${s.id}" title="Supprimer l'étape">
                      <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                `).join("")}
                <form class="addStepForm flex items-center gap-2 mt-1" data-order="${o.id}">
                  <input type="text" placeholder="Ajouter une étape..." class="newStepInput flex-1 bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500" />
                  <button type="submit" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold transition-all">Ajouter</button>
                </form>
              </div>
            </td>
          </tr>
        `;
      });

      rows += `</tbody></table>`;
      wrap.innerHTML = rows;
      list.appendChild(wrap);

      if(!state.orders.length) {
        list.innerHTML += `<p class="text-xs text-slate-500 italic py-6 text-center">Aucune commande en cours. Créez et validez un devis d'abord.</p>`;
      }
      m.appendChild(list);

      list.querySelectorAll(".oStat").forEach(s => s.onchange = e => {
        const o = state.orders.find(x => x.id === e.target.dataset.id);
        if(o) { o.status = e.target.value; save(); }
      });

      list.querySelectorAll(".oPay").forEach(s => s.onchange = e => {
        const o = state.orders.find(x => x.id === e.target.dataset.id);
        if(o) { o.paymentStatus = e.target.value; save(); }
      });

      list.querySelectorAll(".mkInv").forEach(b => b.onclick = e => {
        const o = state.orders.find(x => x.id === e.target.dataset.id);
        if(!o) return;

        const due = new Date();
        due.setDate(due.getDate() + 14);

        state.invoices.push({
          id: uid("FAC-"),
          orderId: o.id,
          clientId: o.clientId,
          items: o.items,
          total: o.price,
          dateIssued: today(),
          dueDate: due.toISOString().slice(0,10),
          status: "Impayée"
        });

        o.invoiced = true;
        save();
        render();
        showToast(`Facture créée pour la commande ${o.id}`, "success");
      });

      // Suivi de projet (mini-Kanban par étapes)
      list.querySelectorAll(".toggleSteps").forEach(b => b.onclick = e => {
        const id = e.currentTarget.dataset.id;
        if(expandedOrders.has(id)) expandedOrders.delete(id);
        else expandedOrders.add(id);
        render();
      });

      list.querySelectorAll(".stepCheck").forEach(cb => cb.onchange = e => {
        const o = state.orders.find(x => x.id === e.target.dataset.order);
        if(!o) return;
        const step = ensureOrderSteps(o).find(s => s.id === e.target.dataset.step);
        if(step) { step.done = e.target.checked; save(true); render(); }
      });

      list.querySelectorAll(".delStep").forEach(b => b.onclick = e => {
        const o = state.orders.find(x => x.id === e.currentTarget.dataset.order);
        if(!o) return;
        o.steps = ensureOrderSteps(o).filter(s => s.id !== e.currentTarget.dataset.step);
        save(true);
        render();
      });

      list.querySelectorAll(".addStepForm").forEach(f => f.onsubmit = e => {
        e.preventDefault();
        const o = state.orders.find(x => x.id === e.currentTarget.dataset.order);
        if(!o) return;
        const input = e.currentTarget.querySelector(".newStepInput");
        const label = input.value.trim();
        if(!label) return;
        ensureOrderSteps(o).push({ id: uid("step-"), label, done: false });
        expandedOrders.add(o.id);
        save(true);
        render();
      });
    }

              <button class="sendInvMail text-amber-400 hover:text-amber-300 p-1.5 rounded-lg hover:bg-amber-500/10 transition-all inline-flex items-center gap-1" data-id="${inv.id}" title="Envoyer relance/email">
                <i data-lucide="mail" class="w-4 h-4 pointer-events-none"></i>

              <button class="printInv bg-slate-800 text-slate-200 border border-slate-700 hover:bg-slate-700 px-2.5 py-1 rounded-lg text-xs font-semibold transition-all" data-id="${inv.id}">

    /* ==========================================================================
       8. STATISTIQUES
       ========================================================================== */
    function renderStats(m){
      const c = createCard("Analyse du Chiffre d'Affaires", "Évolution des encaissements mensuels");
      
      const caByMonth = {};
      state.transactions.filter(t => t.type === "revenu").forEach(t => { 
        const k = (t.date || "").slice(0,7); 
        caByMonth[k] = (caByMonth[k] || 0) + Number(t.amount); 
      });

      const months = Object.keys(caByMonth).sort();
      const max = Math.max(1, ...Object.values(caByMonth));

      if(!months.length) {
        c.innerHTML += `<p class="text-xs text-slate-500 italic py-6 text-center">Aucun revenu comptabilisé pour analyser la courbe.</p>`;
      } else {
        const chartContainer = document.createElement("div");
        chartContainer.className = "space-y-3 my-2";

        months.forEach(mo => {
          const val = caByMonth[mo];
          const pct = Math.min(100, Math.max(5, (val / max) * 100));

          chartContainer.innerHTML += `
            <div>
              <div class="flex justify-between text-xs font-semibold mb-1">
                <span class="text-slate-300 font-mono">${mo}</span>
                <span class="text-brand-400 font-bold">${eur(val)}</span>
              </div>
              <div class="w-full h-3 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                <div class="h-full bg-gradient-to-r from-brand-500 to-cyan-400 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        });
        c.appendChild(chartContainer);
      }
      m.appendChild(c);

      // KPI Avancés
      const avg = state.orders.length ? state.orders.reduce((a,o)=>a+Number(o.price||0),0)/state.orders.length : 0;
      const won = state.clients.filter(c=>c.stage==="Client gagné").length;
      const sentQuotes = state.quotes.length;
      const convRate = sentQuotes ? ((state.quotes.filter(q=>q.status==="Accepté").length / sentQuotes) * 100).toFixed(1) : 0;

      const g = createCard("Indicateurs de Performance (KPI)");
      g.innerHTML += `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="p-4 rounded-xl border border-slate-800 bg-slate-950/60">

            <div class="text-2xl font-black text-slate-100 mt-1">${state.orders.length}</div>

            <div class="text-xs text-slate-400 font-medium">Panier Moyen</div>
            <div class="text-2xl font-black text-brand-300 mt-1">${eur(avg)}</div>
          </div>
          <div class="p-4 rounded-xl border border-slate-800 bg-slate-950/60">
            <div class="text-xs text-slate-400 font-medium">Nouveaux Clients</div>
            <div class="text-2xl font-black text-emerald-400 mt-1">${won}</div>
          </div>
          <div class="p-4 rounded-xl border border-slate-800 bg-slate-950/60">
            <div class="text-xs text-slate-400 font-medium">Taux de Conversion Devis</div>
            <div class="text-2xl font-black text-cyan-400 mt-1">${convRate}%</div>
          </div>
        </div>
      `;
      m.appendChild(g);
    }

      m.appendChild(c);

      const typeSel = c.querySelector("#em_template_type");
      const qBox = c.querySelector("#box_quote_select");
      const invBox = c.querySelector("#box_invoice_select");
      const urgBox = c.querySelector("#box_urgency_select");

      const qSel = c.querySelector("#em_quote_select");
      const invSel = c.querySelector("#em_invoice_select");
      const urgSel = c.querySelector("#em_urgency_level");

      const receiverInput = c.querySelector("#em_receiver");
      const subjectInput = c.querySelector("#em_subject");
      const bodyInput = c.querySelector("#em_body");
      const previewDiv = c.querySelector("#em_preview");
      const modeBadge = c.querySelector("#em_mode_badge");
      const mailtoBtn = c.querySelector("#btn-send-mailto");

      // Dynamic toggle selector visibility
      typeSel.onchange = () => {
        const val = typeSel.value;
        qBox.classList.toggle("hidden", val !== "quote" && val !== "discord");
        invBox.classList.toggle("hidden", val !== "invoice" && val !== "invoice_reminder");
        urgBox.classList.toggle("hidden", val !== "invoice_reminder");

        if(val === "discord") {
          modeBadge.textContent = "Format Discord MD";
          modeBadge.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20";
        } else {
          modeBadge.textContent = "Format E-mail";
          modeBadge.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-brand-500/10 text-brand-400 border border-brand-500/20";
        }
        updateTemplateContent();
      };

      qSel.onchange = updateTemplateContent;
      invSel.onchange = updateTemplateContent;
      urgSel.onchange = updateTemplateContent;

      bodyInput.oninput = () => {
        previewDiv.textContent = bodyInput.value;
        updateMailtoLink();
      };

      subjectInput.oninput = updateMailtoLink;
      receiverInput.oninput = updateMailtoLink;

      function updateTemplateContent() {
        const type = typeSel.value;
        let recipientMail = "";
        let subject = "";
        let body = "";

        if(type === "quote") {
          const q = state.quotes.find(x => x.id === qSel.value);
          const cl = q ? state.clients.find(c => c.id === q.clientId) : null;
          recipientMail = cl ? (cl.email || "") : "";
          const clientName = cl ? cl.name : "Client";
          const total = q ? eur(quoteTotal(q)) : "0 €";

          subject = `NEXUS — Votre devis ${q ? q.id : ''}`;
          body = `Bonjour ${clientName},\n\nVeuillez trouver ci-joint les détails de votre devis ${q ? q.id : ''} pour un montant total de ${total}.\n\nPrestations incluses :\n${q ? q.items.map(i => `- ${i.name} (x${i.qty}) : ${eur(i.price * i.qty)}`).join('\n') : '- Détails des prestations'}\n\nCe devis reste valable jusqu'au ${q && q.expiry ? q.expiry : 'date d\'expiration'}.\nN'hésitez pas à revenir vers nous pour toute question ou validation.\n\nCordialement,\nL'équipe NEXUS\nContact : ${senderEmail}`;
        
        } else if(type === "invoice") {
          const inv = state.invoices.find(x => x.id === invSel.value);
          const cl = inv ? state.clients.find(c => c.id === inv.clientId) : null;
          recipientMail = cl ? (cl.email || "") : "";
          const clientName = cl ? cl.name : "Client";

          subject = `NEXUS — Facture ${inv ? inv.id : ''}`;
          body = `Bonjour ${clientName},\n\nVotre commande a bien été traitée. Veuillez trouver votre facture ${inv ? inv.id : ''} d'un montant de ${inv ? eur(inv.total) : '0 €'}.\n\nDate d'échéance de paiement : ${inv ? inv.dueDate : 'A réception'}.\n\nNous vous remercions de votre confiance.\n\nCordialement,\nNEXUS Business\n${senderEmail}`;
        
        } else if(type === "invoice_reminder") {
          const inv = state.invoices.find(x => x.id === invSel.value);
          const cl = inv ? state.clients.find(c => c.id === inv.clientId) : null;
          recipientMail = cl ? (cl.email || "") : "";
          const clientName = cl ? cl.name : "Client";
          const level = urgSel.value;

          if(level === "courteous") {
            subject = `Rappel amical : Facture ${inv ? inv.id : ''} - NEXUS`;
            body = `Bonjour ${clientName},\n\nSauf erreur de notre part, la facture ${inv ? inv.id : ''} d'un montant de ${inv ? eur(inv.total) : '0 €'} arrivée à échéance le ${inv ? inv.dueDate : ''} reste non réglée à ce jour.\n\nNous vous invitons à procéder à son règlement dans les meilleurs délais.\nSi votre paiement a déjà été envoyé, merci de ne pas tenir compte de ce message.\n\nCordialement,\nNEXUS\n${senderEmail}`;
          } else if(level === "relance1") {
            subject = `RELANCE : Impayé Facture ${inv ? inv.id : ''} - NEXUS`;
            body = `Bonjour ${clientName},\n\nMalgré notre première relance, nous constatons que la facture ${inv ? inv.id : ''} (${inv ? eur(inv.total) : '0 €'}) venant à échéance le ${inv ? inv.dueDate : ''} n'a toujours pas été régularisée.\n\nNous vous prions de bien vouloir effectuer le règlement dans un délai de 48 heures.\n\nRestant à votre disposition pour tout justificatif.\n\nCordialement,\nService Comptabilité NEXUS\n${senderEmail}`;
          } else {
            subject = `DERNIER AVIS AVANT RECOUVREMENT : Facture ${inv ? inv.id : ''}`;
            body = `Madame, Monsieur ${clientName},\n\nSauf règlement sous 24h de la facture ${inv ? inv.id : ''} d'un montant de ${inv ? eur(inv.total) : '0 €'}, nous nous verrons contraints d'interrompre immédiatement nos prestations et de transmettre le dossier au service recouvrement.\n\nMerci de procéder immédiatement au virement.\n\nService Contentieux NEXUS\nContact : ${senderEmail}`;
          }

        } else if(type === "discord") {
          const q = state.quotes.find(x => x.id === qSel.value);
          const cl = q ? state.clients.find(c => c.id === q.clientId) : null;
          const clientName = cl ? (cl.discord ? `@${cl.discord}` : cl.name) : "Client";
          const total = q ? eur(quoteTotal(q)) : "0 €";

          subject = `[DISCORD DM] Proposition Devis / Commande ${q ? q.id : ''}`;
          body = `👋 **Hello ${clientName} !**\n\nVoici le récapitulatif de votre commande NEXUS :\n\n📌 **Devis n°** : \`${q ? q.id : 'DEV-XXX'}\`\n💰 **Montant total** : \`${total}\`\n\n🛠 **Détail des prestations** :\n\`\`\`\n${q ? q.items.map(i => `• ${i.name} (x${i.qty}) -> ${eur(i.price * i.qty)}`).join('\n') : '• Prestation Discord Setup / Bot'}\n\`\`\`\n\nPour valider cette commande ou si tu as des questions, réponds directement à ce message ou contacte-nous par email : \`${senderEmail}\` !`;
        }

        receiverInput.value = recipientMail;
        subjectInput.value = subject;
        bodyInput.value = body;
        previewDiv.textContent = body;
        updateMailtoLink();
      }

      function updateMailtoLink() {
        const to = encodeURIComponent(receiverInput.value);
        const sub = encodeURIComponent(subjectInput.value);
        const body = encodeURIComponent(bodyInput.value);
        mailtoBtn.href = `mailto:${to}?subject=${sub}&body=${body}`;
      }

      // Action Copy
      c.querySelector("#btn-copy-mail").onclick = () => {
        const textToCopy = bodyInput.value;
        if(!textToCopy) return showToast("Aucun texte à copier", "error");

        if(navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(textToCopy);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = textToCopy;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }
        showToast("Message copié dans le presse-papier !", "success");
      };

      // Trigger first init
      updateTemplateContent();
    }

    /* ==========================================================================
       10. SAUVEGARDE & PARAMÈTRES
       ========================================================================== */
    function renderBackup(m){
      const c = createCard("Sauvegarde des Données", "Gérez les sauvegardes locales JSON et la synchronisation cloud");
      c.innerHTML += `
        <p class="text-xs text-slate-400 mb-6">Vos données sont automatiquement synchronisées en temps réel via Firebase Realtime Database. Vous pouvez également réaliser un export de précaution sous format JSON.</p>
        
        <div class="flex flex-wrap gap-4">
          <button id="btn-export-json" class="bg-gradient-to-r from-brand-500 to-cyan-500 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-2 hover:opacity-90 transition-all shadow-md shadow-brand-500/20">
            <i data-lucide="download" class="w-4 h-4"></i> Exporter Sauvegarde (JSON)
          </button>

          <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold px-4 py-2.5 rounded-xl text-xs flex items-center gap-2 cursor-pointer transition-all">
            <i data-lucide="upload" class="w-4 h-4"></i> Importer un fichier JSON
            <input id="json-file-input" type="file" accept="application/json" class="hidden">
          </label>
        </div>
      `;

      c.querySelector("#btn-export-json").onclick = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
        a.download = `nexus_backup_${today()}.json`;
        a.click();
        showToast("Fichier JSON de sauvegarde généré", "success");
      };

      c.querySelector("#json-file-input").onchange = e => {
        const f = e.target.files[0];
        if(!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const data = JSON.parse(r.result);
            if(confirm("Attention : Remplacer l'intégralité des données actuelles par ce fichier ?")) {
              state = data;
              save();
              render();
              showToast("Restauration réussie !", "success");
            }
          } catch(err) {
            showToast("Fichier JSON invalide.", "error");
          }
        };
        r.readAsText(f);
      };

      m.appendChild(c);

      // Zone de danger
      const danger = createCard("Zone de Réinitialisation", "Attention : Les actions ci-dessous sont irréversibles");
      danger.innerHTML += `
        <div class="flex items-center justify-between">
          <div>
            <div class="text-xs font-bold text-rose-400">Purger toutes les données</div>
            <div class="text-[11px] text-slate-500">Supprime définitivement vos clients, devis, prestations et factures.</div>
          </div>
          <button id="btn-reset-all" class="bg-rose-500/10 text-rose-400 border border-rose-500/20 hover:bg-rose-500/20 px-4 py-2 rounded-xl text-xs font-bold transition-all">
            Réinitialiser tout
          </button>
        </div>
      `;

      danger.querySelector("#btn-reset-all").onclick = () => {
        if(confirm("ÊTES-VOUS SÛR ? Cette action supprimera définitivement l'ensemble de vos données Nexus !")) {
          state = { clients:[], products: JSON.parse(JSON.stringify(DEFAULT_PRODUCTS)), quotes:[], orders:[], transactions:[], invoices:[] };
          save();
          render();
          showToast("Base de données réinitialisée", "info");
        }
      };

      m.appendChild(danger);
    }
  </script>
</body>
